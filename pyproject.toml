[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nnbench"
version = "0.1.0"
description = "Neural networks (MLP, CNN) and optimizers from scratch in NumPy, benchmarked against PyTorch on MNIST and CIFAR-10."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
flops = ["ptflops", "fvcore"]
dev = ["pytest>=7", "seaborn", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
